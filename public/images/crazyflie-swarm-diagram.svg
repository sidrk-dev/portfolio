  <rect x="736" y="156" width="400" height="490" rx="4" fill="#1b1d20" stroke="#3c4046" stroke-width="1.5"/>
  <text x="762" y="196" fill="#f2f0eb" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">CONTRIBUTIONS &amp; METRICS</text>
  <line x1="762" y1="216" x2="1110" y2="216" stroke="#2d3136"/>

