  <text x="762" y="280" fill="#9ca3af" font-family="Inter, sans-serif" font-size="13">Optimized quadrotor motor-mixing control</text>
  <text x="762" y="300" fill="#9ca3af" font-family="Inter, sans-serif" font-size="13">allocation reducing actuator saturation spikes.</text>

  <line x1="762" y1="330" x2="1110" y2="330" stroke="#2d3136"/>
  <text x="762" y="368" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">Velocity-Obstacle Avoidance</text>
  <text x="762" y="394" fill="#9ca3af" font-family="Inter, sans-serif" font-size="13">Real-time Python cflib + ROS 2 ground</text>
  <text x="762" y="414" fill="#9ca3af" font-family="Inter, sans-serif" font-size="13">station deconflicting 3D multi-agent paths.</text>

  <line x1="762" y1="444" x2="1110" y2="444" stroke="#2d3136"/>
  <text x="762" y="482" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">Peer-Reviewed Publication</text>
  <text x="762" y="508" fill="#d1d5db" font-family="Inter, sans-serif" font-size="13">Co-authored paper accepted at IEEE</text>
  <text x="762" y="528" fill="#d1d5db" font-family="Inter, sans-serif" font-size="13">International Conference on Automation</text>
  <text x="762" y="548" fill="#d1d5db" font-family="Inter, sans-serif" font-size="13">Science and Engineering (CASE 2025).</text>

  <text x="64" y="736" fill="#9ca3af" font-family="JetBrains Mono, monospace" font-size="13">BITCRAZE CRAZYFLIE 2.X · PYTHON CFLIB · ROS 2 · LIGHTHOUSE 3D TRACKING</text>
