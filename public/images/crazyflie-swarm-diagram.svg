  <circle cx="260" cy="390" r="22" fill="#131416" stroke="#2dd4bf" stroke-width="2"/>
  <text x="242" y="395" fill="#f2f0eb" font-family="JetBrains Mono, monospace" font-size="13">CF1</text>

  <circle cx="465" cy="465" r="22" fill="#131416" stroke="#38bdf8" stroke-width="2"/>
  <text x="447" y="470" fill="#f2f0eb" font-family="JetBrains Mono, monospace" font-size="13">CF2</text>
  <path d="M 465 465 L 365 555" stroke="#38bdf8" stroke-width="2.5"/>

  <circle cx="220" cy="545" r="22" fill="#131416" stroke="#a78bfa" stroke-width="2"/>
  <text x="202" y="550" fill="#f2f0eb" font-family="JetBrains Mono, monospace" font-size="13">CF3</text>
  <path d="M 220 545 L 330 575" stroke="#a78bfa" stroke-width="2.5"/>

